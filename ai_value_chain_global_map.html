<script>

const periodSettings = [
    {
        cmin: -8.249978986299066,
        cmax: 8.249978986299066
    },
    {
        cmin: -23.035002357467402,
        cmax: 23.035002357467402
    },
    {
        cmin: -31.41783029001074,
        cmax: 31.41783029001074
    },
    {
        cmin: -246.08729902273484,
        cmax: 246.08729902273484
    }
];


function changePeriod(index) {

    const visible = [
        false, false,
        false, false,
        false, false,
        false, false
    ];

    visible[index * 2] = true;
    visible[index * 2 + 1] = true;

    const settings = periodSettings[index];

    Plotly.restyle(
        "global-map-chart",
        {
            visible: visible
        }
    );

    Plotly.restyle(
        "global-map-chart",
        {
            "marker.cmin": settings.cmin,
            "marker.cmax": settings.cmax
        },
        [0, 2, 4, 6]
    ).then(() => {

        // 表示対象のトレースに対応するカラーバーを更新
        Plotly.relayout(
            "global-map-chart",
            {
                "title": ""
            }
        );

    });

    document.querySelectorAll(".period-btn").forEach(
        (button, buttonIndex) => {

            button.classList.toggle(
                "active",
                buttonIndex === index
            );

        }
    );
}


document.querySelectorAll(".period-btn").forEach(
    button => {

        button.addEventListener("click", () => {

            changePeriod(
                Number(button.dataset.period)
            );

        });

    }
);


window.addEventListener("resize", () => {

    const chart = document.getElementById(
        "global-map-chart"
    );

    if (chart) {
        Plotly.Plots.resize(chart);
    }

});

</script>
