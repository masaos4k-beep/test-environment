<script>

const periodSettings = [
    {
        cmin: -6.690140845070422,
        cmax: 6.690140845070422
    },
    {
        cmin: -19.79472650278338,
        cmax: 19.79472650278338
    },
    {
        cmin: -46.214358415374015,
        cmax: 46.214358415374015
    },
    {
        cmin: -136.9333551028906,
        cmax: 136.9333551028906
    }
];


function changePeriod(index) {

    const visible = [
        false, false,
        false, false,
        false, false,
        false, false
    ];

    visible[index * 2] = true;
    visible[index * 2 + 1] = true;

    const settings = periodSettings[index];

    Plotly.restyle(
        "global-map-chart",
        {
            visible: visible
        }
    );

    Plotly.restyle(
        "global-map-chart",
        {
            "marker.cmin": settings.cmin,
            "marker.cmax": settings.cmax
        },
        [0, 2, 4, 6]
    ).then(() => {

        // 表示対象のトレースに対応するカラーバーを更新
        Plotly.relayout(
            "global-map-chart",
            {
                "title": ""
            }
        );

    });

    document.querySelectorAll(".period-btn").forEach(
        (button, buttonIndex) => {

            button.classList.toggle(
                "active",
                buttonIndex === index
            );

        }
    );
}


document.querySelectorAll(".period-btn").forEach(
    button => {

        button.addEventListener("click", () => {

            changePeriod(
                Number(button.dataset.period)
            );

        });

    }
);


window.addEventListener("resize", () => {

    const chart = document.getElementById(
        "global-map-chart"
    );

    if (chart) {
        Plotly.Plots.resize(chart);
    }

});

</script>
