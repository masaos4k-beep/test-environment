<script>

const periodSettings = [
    {
        cmin: -13.559322033898317,
        cmax: 13.559322033898317
    },
    {
        cmin: -14.91499227202473,
        cmax: 14.91499227202473
    },
    {
        cmin: -28.96070608835351,
        cmax: 28.96070608835351
    },
    {
        cmin: -306.2952437338426,
        cmax: 306.2952437338426
    }
];


function changePeriod(index) {

    const visible = [
        false, false,
        false, false,
        false, false,
        false, false
    ];

    visible[index * 2] = true;
    visible[index * 2 + 1] = true;

    const settings = periodSettings[index];

    Plotly.restyle(
        "global-map-chart",
        {
            visible: visible
        }
    );

    Plotly.restyle(
        "global-map-chart",
        {
            "marker.cmin": settings.cmin,
            "marker.cmax": settings.cmax
        },
        [0, 2, 4, 6]
    ).then(() => {

        // 表示対象のトレースに対応するカラーバーを更新
        Plotly.relayout(
            "global-map-chart",
            {
                "title": ""
            }
        );

    });

    document.querySelectorAll(".period-btn").forEach(
        (button, buttonIndex) => {

            button.classList.toggle(
                "active",
                buttonIndex === index
            );

        }
    );
}


document.querySelectorAll(".period-btn").forEach(
    button => {

        button.addEventListener("click", () => {

            changePeriod(
                Number(button.dataset.period)
            );

        });

    }
);


window.addEventListener("resize", () => {

    const chart = document.getElementById(
        "global-map-chart"
    );

    if (chart) {
        Plotly.Plots.resize(chart);
    }

});

</script>
