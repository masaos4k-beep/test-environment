<!doctype html>

    <meta charset="utf-8" />
    <style>html, body {height: 100%;}</style>

<style>
html, body {
    margin: 0;
    padding: 0;
    background: #111111;
    color: #FFFFFF;
    font-family: Arial, "Noto Sans JP", sans-serif;
}

.index-button-area {
    display: flex;
    justify-content: flex-end;
    align-items: center;
    flex-wrap: wrap;
    gap: 6px;
    padding: 10px 20px;
    box-sizing: border-box;
    background: #111111;
}

.index-button {
    background: #292929;
    color: #DDDDDD;
    border: 1px solid #444444;
    border-radius: 4px;
    padding: 9px 20px;
    font-size: 13px;
    font-weight: bold;
    cursor: pointer;
}

.index-button.active {
    background: #1677FF;
    color: #FFFFFF;
    border-color: #1677FF;
}

.index-button:hover {
    border-color: #66AAFF;
}

#chart-container {
    width: 100%;
}

@media (max-width: 600px) {
    .index-button-area {
        justify-content: center;
        padding: 8px;
        gap: 4px;
    }

    .index-button {
        padding: 8px 12px;
        font-size: 12px;
    }
}
</style>

<div class="index-button-area">
    <button class="index-button active" data-index="SP500">
        S&amp;P 500
    </button>
    <button class="index-button" data-index="NASDAQ100">
        NASDAQ 100
    </button>
    <button class="index-button" data-index="SOX">
        SOX（半導体）
    </button>
</div>

    function initializeChart() {
        const plot = document.querySelector(".plotly-graph-div");

        if (!plot || !window.Plotly) {
            setTimeout(initializeChart, 100);
            return;
        }

        // ボタンをチャートの上に独立して配置
        const buttonArea = document.querySelector(".index-button-area");

        if (buttonArea && plot.parentElement) {
            plot.parentElement.insertBefore(buttonArea, plot);
        }

        // 画面幅に応じてチャートの高さを設定
        function resizeChart() {
            const width = window.innerWidth;

            let height;

            if (width < 600) {
                height = 430;
            } else if (width < 1000) {
                height = 470;
            } else {
                height = 520;
            }

            Plotly.relayout(plot, {
                height: height,
                autosize: true
            });
        }

        function selectIndex(key) {
            const config = configs[key];

            if (!config) {
                return;
            }

            const keys = ["SP500", "NASDAQ100", "SOX"];

            const visibility = keys.map(function (item) {
                return item === key;
            });

            // 表示する指数を切り替え
            Plotly.restyle(plot, {
                visible: visibility
            });

            // タイトル・PER軸・ゾーン・説明文をまとめて更新
            Plotly.relayout(plot, {
                "title.text":
                    config.name
                    + " 1年予想PER 推移（2026年）",

                "yaxis.range": config.y_range,

                "shapes": config.shapes,

                "annotations": config.annotations
            });

            // 選択中ボタンを青色にする
            document.querySelectorAll(".index-button").forEach(
                function (button) {
                    button.classList.toggle(
                        "active",
                        button.dataset.index === key
                    );
                }
            );
        }

        document.querySelectorAll(".index-button").forEach(
            function (button) {
                button.addEventListener("click", function () {
                    selectIndex(button.dataset.index);
                });
            }
        );

        resizeChart();

        window.addEventListener("resize", resizeChart);
    }

    if (document.readyState === "loading") {
        document.addEventListener(
            "DOMContentLoaded",
            initializeChart
        );
    } else {
        initializeChart();
    }
})();
