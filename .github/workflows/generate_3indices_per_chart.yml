name: Generate 3 Indices Forward PE Chart

'on':
  workflow_dispatch:
  workflow_run:
    workflows:
      - Capture Forward PE
    types:
      - completed

permissions:
  contents: write

jobs:
  generate-chart:
    runs-on: ubuntu-latest

    # CSV取得が成功した場合だけチャートを生成
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install libraries
        run: |
          python -m pip install --upgrade pip
          pip install pandas plotly

      - name: Generate Forward PE chart
        run: |
          python scripts/3indices_per_chart.py

      - name: Commit generated HTML
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add 3indices_per_chart_chart.html

          if git diff --cached --quiet; then
            echo "HTMLに変更はありません"
          else
            git commit -m "Update 3 indices Forward PE chart"
            git push
          fi
