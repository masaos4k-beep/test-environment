name: Generate SP500 2026 Target

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-chart:
    runs-on: ubuntu-latest

    steps:
      # 1. リポジトリを取得
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Python環境を準備
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 3. 必要なライブラリをインストール
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas yfinance numpy plotly

      # 4. S&P500目標チャートを生成
      - name: Generate SP500 Target HTML
        run: |
          python scripts/SP500_2026_target.py

      # 5. 生成したHTMLをGitHubにコミット
      - name: Commit and push generated HTML
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add SP500_2026_target.html

          if git diff --cached --quiet; then
            echo "HTMLに変更がないため、コミットをスキップします。"
          else
            git commit -m "Update SP500 2026 target chart"
            git push
          fi
