name: 毎朝の株価・市場ニュース更新

on:
  # 毎朝 7:30（日本時間）に実行。GitHub Actionsの時刻はUTCです。
  schedule:
    - cron: "30 22 * * *"
  # GitHub Actions画面から手動実行も可能
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-market-update
  cancel-in-progress: false

jobs:
  update-market:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: リポジトリを読み込む
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Pythonをセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 必要なライブラリをインストール
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas google-genai

      - name: 株価ダッシュボードを生成
        run: |
          python scripts/market_dashboard.py
          test -s market_dashboard.html

      - name: 市場ニュースを取得してGeminiで分析
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.1-flash-lite
        run: |
          python scripts/market_news_analysis.py
          test -s market_analysis.json

      - name: 生成ファイルをリポジトリに反映
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add market_dashboard.html market_analysis.json
          if git diff --cached --quiet; then
            echo "生成ファイルに変更はありません。"
          else
            git commit -m "Update daily market dashboard and news analysis"
            git push origin HEAD:main
          fi
