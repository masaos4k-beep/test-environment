name: Generate YTD Index Comparison

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-chart:
    runs-on: ubuntu-latest

    steps:
      # 1. リポジトリを取得
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Python環境を準備
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 3. 必要なライブラリをインストール
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas yfinance plotly

      # 4. 年初来騰落率チャートを生成
      - name: Generate YTD Index Comparison HTML
        run: |
          python scripts/ytd_Index_comparison.py

      # 5. 生成したHTMLをGitHubにコミット
      - name: Commit and push generated HTML
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add ytd_Index_comparison.html

          if git diff --cached --quiet; then
            echo "HTMLに変更がないため、コミットをスキップします。"
          else
            git commit -m "Update YTD index comparison chart"
            git push
          fi
