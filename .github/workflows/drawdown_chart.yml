name: Drawdown Chart

'on':
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install libraries
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas plotly

      - name: Run drawdown chart
        run: python scripts/3indices_drawdown_chart.py

      - name: Commit generated HTML
        run: |
          if [ -f 3indices_drawdown_chart.html ]; then
            git add 3indices_drawdown_chart.html
            if ! git diff --cached --quiet; then
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git commit -m "Update drawdown chart"
              git push
            else
              echo "HTMLに変更がないため、コミットをスキップします。"
            fi
          else
            echo "ERROR: 3indices_drawdown_chart.html が生成されませんでした。"
            exit 1
          fi
