<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#071426">
<title>3指数の年初来ドローダウン分析</title>

<style>
:root {
  color-scheme: dark;
  --bg: #07111f;
  --panel: #101d2e;
  --line: #26374d;
  --text: #eef4fb;
  --muted: #a9b8cb;
  --accent: #65b8ff;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: Arial, "Noto Sans JP", "Meiryo", sans-serif;
  line-height: 1.65;
}

.wrap {
  max-width: 1500px;
  margin: auto;
  padding: 24px;
}

.toplink {
  display: inline-block;
  color: var(--accent);
  text-decoration: none;
  margin-bottom: 16px;
}

h1 {
  font-size: clamp(23px, 3vw, 32px);
  margin: 0 0 12px;
}

.description {
  color: #d3deeb;
  margin-bottom: 22px;
}

.panel {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 20px;
  margin-bottom: 20px;
}

.framebox {
  overflow: hidden;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: #050505;
}

.framebox iframe {
  display: block;
  width: 100%;
  height: 900px;
  border: 0;
  background: #050505;
}

.open-link {
  display: inline-block;
  margin-top: 12px;
  color: var(--accent);
}

footer {
  color: var(--muted);
  font-size: 12px;
  margin: 26px 0 8px;
}

@media (max-width: 650px) {
  .wrap {
    padding: 12px;
  }

  .panel {
    padding: 12px;
  }

  .framebox iframe {
    height: 1000px;
  }
}
</style>
</head>

<body>
<main class="wrap">

<a class="toplink" href="index.html">← トップページへ戻る</a>

<section>
  <h1>3指数の年初来ドローダウン分析</h1>

  <p class="description">
    S&P 500・NASDAQ 100・SOX（半導体株指数）について、
    年初来の高値からの下落率を円建て・ドル建てで比較します。
    指数を切り替えながら、株価の下落状況を確認できます。
  </p>

  <div class="panel">
    <div class="framebox">
      <iframe
        src="3indices_drawdown_chart.html"
        title="S&P 500・NASDAQ 100・SOXの年初来ドローダウン分析"
        loading="lazy">
      </iframe>
    </div>

    <a
      class="open-link"
      href="3indices_drawdown_chart.html"
      target="_blank"
      rel="noopener">
      チャートを別タブで開く ↗
    </a>
  </div>
</section>

<footer>
  ※ チャートはPythonプログラムによって生成されます。
  表示される株価データの更新状況を確認したうえで、投資判断はご自身で行ってください。
</footer>

</main>
</body>
</html>
