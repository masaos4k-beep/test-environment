<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: #080b0d;
    color: #f0f5f3;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans JP",
        sans-serif;
}

.topbar {
    width: 100%;
    height: 76px;

    display: flex;
    justify-content: space-between;
    align-items: center;

    gap: 16px;

    padding: 10px 20px;

    background: #0b1012;
    border-bottom: 1px solid #29363a;
}

.page-title {
    font-size: 21px;
    font-weight: 700;
    color: #f0f5f3;
}

.period-buttons {
    display: flex;
    gap: 6px;
    align-items: center;

    padding: 4px;

    border: 1px solid #29363a;
    border-radius: 8px;

    background: #151e22;
}

.period-btn {
    min-width: 76px;

    padding: 10px 14px;

    border: 1px solid transparent;
    border-radius: 6px;

    background: transparent;
    color: #a0b0b2;

    font-size: 14px;
    font-weight: 700;

    cursor: pointer;
}

.period-btn:hover {
    background: #243239;
    color: #ffffff;
}

.period-btn.active {
    background: #289dff;
    color: #ffffff;
    border-color: #289dff;
}

.chart-container {
    width: 100%;
    height: calc(100vh - 76px);

    padding: 0;
    margin: 0;

    overflow: hidden;
}

#heatmap-chart {
    width: 100% !important;
    height: 100% !important;
}

.js-plotly-plot,
.plot-container,
.svg-container {
    max-width: 100%;
}

@media (max-width: 700px) {

    .topbar {
        height: auto;
        min-height: 110px;

        padding: 10px;

        align-items: flex-start;
        flex-direction: column;
    }

    .page-title {
        font-size: 17px;
    }

    .period-buttons {
        width: 100%;

        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
    }

    .period-btn {
        min-width: 0;
        padding: 9px 4px;
        font-size: 12px;
    }

    .chart-container {
        height: calc(100vh - 110px);
    }
}

</style>

<script>

const periodSettings = [
    {
        title: "1日騰落率 (%)",
        cmin: -10.638068083635737,
        cmax: 10.638068083635737
    },
    {
        title: "1週間騰落率 (%)",
        cmin: -14.171325680812604,
        cmax: 14.171325680812604
    },
    {
        title: "1ヶ月騰落率 (%)",
        cmin: -39.08629412524126,
        cmax: 39.08629412524126
    },
    {
        title: "年初来騰落率 (%)",
        cmin: -229.19443240475016,
        cmax: 229.19443240475016
    }
];


function changePeriod(index) {

    const visible = [
        false,
        false,
        false,
        false
    ];

    visible[index] = true;

    const settings = periodSettings[index];

    Plotly.update(
        "heatmap-chart",

        {
            visible: visible
        },

        {
            "coloraxis.cmin": settings.cmin,
            "coloraxis.cmax": settings.cmax,
            "coloraxis.colorbar.title.text": settings.title
        }
    );

    document.querySelectorAll(".period-btn").forEach(
        (button, buttonIndex) => {

            button.classList.toggle(
                "active",
                buttonIndex === index
            );
        }
    );
}


document.querySelectorAll(".period-btn").forEach(
    button => {

        button.addEventListener("click", () => {

            changePeriod(
                Number(button.dataset.period)
            );

        });
    }
);


window.addEventListener("resize", () => {

    const chart = document.getElementById(
        "heatmap-chart"
    );

    if (chart) {
        Plotly.Plots.resize(chart);
    }

});

</script>
