<!doctype html>
<html>
<head>
    <meta charset="utf-8" />
    <style>html, body {height: 100%;}</style>
</head>
<body>

<style>
.index-button-area {
    display: flex;
    justify-content: flex-end;
    align-items: center;
    flex-wrap: wrap;
    gap: 6px;
    padding: 10px 20px 4px;
    box-sizing: border-box;
    background: #111111;
}

.index-button {
    background-color: #292929;
    color: #DDDDDD;
    border: 1px solid #444444;
    border-radius: 4px;
    padding: 9px 20px;
    font-size: 13px;
    font-weight: bold;
    cursor: pointer;
}

.index-button.active {
    background-color: #1677FF;
    color: #FFFFFF;
    border-color: #1677FF;
}

.index-button:hover {
    border-color: #66AAFF;
}

@media (max-width: 600px) {
    .index-button-area {
        justify-content: center;
        gap: 4px;
        padding: 8px;
    }

    .index-button {
        padding: 8px 12px;
        font-size: 12px;
    }
}
</style>

<div class="index-button-area">
    <button class="index-button active" data-index="SP500">S&P 500</button>
<button class="index-button" data-index="NASDAQ100">NASDAQ 100</button>
<button class="index-button" data-index="SOX">SOX（半導体）</button>
</div>

<script>
(function () {

    const configs = {"SP500": {"name": "S&P 500", "price_origin": 5000, "price_max": 8800.0, "eps_origin": 200, "eps_max": 470.0, "price_trace": 0, "eps_trace": 1}, "NASDAQ100": {"name": "NASDAQ 100", "price_origin": 15000, "price_max": 35000.0, "eps_origin": 500, "eps_max": 1630.0, "price_trace": 2, "eps_trace": 3}, "SOX": {"name": "SOX（半導体）", "price_origin": 3000, "price_max": 16400.0, "eps_origin": 100, "eps_max": 770.0, "price_trace": 4, "eps_trace": 5}};
    const initialKey = "SP500";

    function initializeChart() {

        const plot = document.querySelector(".plotly-graph-div");

        if (!plot || !window.Plotly) {
            setTimeout(initializeChart, 100);
            return;
        }

        const buttonArea = document.querySelector(
            ".index-button-area"
        );

        // ボタン領域をチャートの直前に配置
        if (buttonArea && plot.parentElement) {
            plot.parentElement.insertBefore(
                buttonArea,
                plot
            );
        }

        function selectIndex(key) {

            const config = configs[key];

            if (!config) {
                return;
            }

            const visibility = Array(
                6
            ).fill(false);

            visibility[config.price_trace] = true;
            visibility[config.eps_trace] = true;

            // 株価とEPSを切り替える
            Plotly.restyle(
                plot,
                {visible: visibility}
            );

            // タイトルと左右のY軸を切り替える
            Plotly.relayout(plot, {
                "title.text":
                    "<b>" + config.name
                    + " 株価 & 1年予想EPS "
                    + "年初来推移（2026年）</b>",

                "yaxis.range": [
                    config.price_origin,
                    config.price_max
                ],

                "yaxis2.range": [
                    config.eps_origin,
                    config.eps_max
                ]
            });

            // 選択中のボタンを青色にする
            document.querySelectorAll(
                ".index-button"
            ).forEach(function (button) {

                button.classList.toggle(
                    "active",
                    button.dataset.index === key
                );
            });
        }

        document.querySelectorAll(
            ".index-button"
        ).forEach(function (button) {

            button.addEventListener(
                "click",
                function () {
                    selectIndex(button.dataset.index);
                }
            );
        });

        // 初期表示を同期
        selectIndex(initialKey);
    }

    if (document.readyState === "loading") {
        document.addEventListener(
            "DOMContentLoaded",
            initializeChart
        );
    } else {
        initializeChart();
    }

})();
</script>
