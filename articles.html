<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="株式市場や投資についての分析記事一覧"><title>記事一覧｜Beyond the Headlines</title><link rel="stylesheet" href="styles.css"></head>
<body><header class="site-header"><a class="brand" href="index.html"><span class="brand-mark">BH</span><span class="brand-copy"><strong>BEYOND THE HEADLINES</strong><small>知るほど、未来は変わる。</small></span></a><nav class="main-nav"><a href="index.html#latest-articles">最新記事</a><a href="index.html#contents">分析コンテンツ</a></nav></header>
<main class="section-wrap" style="padding-top:60px;padding-bottom:80px"><div class="section-heading"><div><p class="section-kicker">ARTICLE ARCHIVE</p><h1>記事一覧</h1></div><p>株式市場・経済・投資についての考察</p></div><div class="article-grid" id="all-articles-grid"><p class="article-empty">記事一覧を読み込んでいます…</p></div></main><footer class="site-footer"><a class="footer-brand" href="index.html">BEYOND THE HEADLINES</a><span>知るほど、未来は変わる。</span></footer>
<script>
(async()=>{const box=document.getElementById('all-articles-grid');try{const r=await fetch('articles.json',{cache:'no-store'});if(!r.ok)throw Error();const data=await r.json();data.sort((a,b)=>(b.date||'').localeCompare(a.date||''));if(!data.length){box.innerHTML='<p class="article-empty">記事はまだありません。</p>';return;}box.innerHTML='';for(const a of data){const card=document.createElement('article');card.className='article-card';const link=document.createElement('a');link.className='article-card-link';link.href=a.url;const tag=document.createElement('span');tag.className='tag';tag.textContent=a.category||'記事';const h=document.createElement('h3');h.textContent=a.title||'タイトル未設定';const time=document.createElement('time');time.className='article-date';time.textContent=a.date||'';const d=document.createElement('p');d.textContent=a.description||'';const more=document.createElement('span');more.className='card-link';more.textContent='記事を読む ↗';link.append(tag,h,time,d,more);card.append(link);box.append(card);}}catch(e){box.innerHTML='<p class="article-empty">記事一覧を読み込めませんでした。</p>';}})();
</script></body></html>
